name: Build

# Minimal CI for Shelldon SSH. The much larger upstream ConnectBot pipeline (SonarCloud,
# signed releases, Renovate, stale-issue bot) is parked in .github/upstream/ and is NOT active.
# Rules for this workflow:
#   - read-only token, no secrets, no publishing, no signing keys
#   - every third-party action pinned to a full commit SHA (taken from upstream's actions.lock)
#   - runs only on push to main, pull requests and manual dispatch (no cron)
#
# Memory note: private repositories get a 2-vCPU / 7 GB runner, while upstream's pipeline runs
# on the 16 GB runners public repositories get. The defaults in gradle.properties (5 GB Gradle
# heap plus a 2 GB unit-test JVM plus a Kotlin daemon) got the first run killed during the unit
# tests ("The runner has received a shutdown signal"). So this workflow lowers the heap, compiles
# Kotlin in-process, adds swap, and builds the APK before the tests so it is kept either way.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Only supersede older pull-request runs; never cancel a build of main halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (full history and tags, needed for the version code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch the upstream tag the version code is derived from
        # Read-only fetch of one public tag. It is already an ancestor of main; this repo has no
        # copy of the tag until it is pushed once (see CLAUDE.md). A no-op when the tag exists.
        run: git fetch --no-tags https://github.com/connectbot/connectbot.git 'refs/tags/v1.12.0-alpha:refs/tags/v1.12.0-alpha'

      - name: Add swap and show runner resources
        continue-on-error: true
        run: |
          sudo fallocate -l 8G /mnt/gradle-swap
          sudo chmod 600 /mnt/gradle-swap
          sudo mkswap /mnt/gradle-swap
          sudo swapon /mnt/gradle-swap
          free -h
          df -h / /mnt
          nproc

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Build open-source debug APK
        # Command-line properties override gradle.properties (lower heap, no separate Kotlin daemon).
        run: |
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleOssDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shelldon-oss-debug-apk
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release Gradle memory before the tests
        run: |
          ./gradlew --stop
          free -h

      - name: Run unit tests
        run: |
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testOssDebugUnitTest

      - name: Show resources after the build
        if: always()
        run: |
          free -h
          df -h / /mnt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

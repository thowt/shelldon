name: Build

# Minimal CI for Shelldon SSH. The much larger upstream ConnectBot pipeline (SonarCloud,
# signed releases, Renovate, stale-issue bot) is parked in .github/upstream/ and is NOT active.
# Rules for this workflow:
#   - read-only token, no publishing; the only secrets are the optional internal signing key
#     (SHELLDON_KEYSTORE_BASE64, SHELLDON_KEYSTORE_PASSWORD, SHELLDON_KEY_ALIAS), see docs/SIGNING.md
#   - every third-party action pinned to a full commit SHA (taken from upstream's actions.lock)
#   - runs only on push to main, pull requests and manual dispatch (no cron)
#   - a push to main that changes nothing but docs/** and Markdown files does not start a build; pull
#     requests always build, because the branch rules on main require this check (see paths-ignore below)
#   - one job, two variants (a full run of both took ~37 minutes):
#       pull request          -> debug APK + unit tests only, no secrets are touched
#       push to main          -> optimised release APK only (signed with the internal key); the unit
#                                tests already ran on the pull request
#       manual dispatch       -> release by default, or debug; pick the branch in the Run dialog,
#                                so any branch can produce a release APK on demand
#
# Memory note: private repositories get a 2-vCPU / 7 GB runner, while upstream's pipeline runs
# on the 16 GB runners public repositories get. The defaults in gradle.properties (5 GB Gradle
# heap plus a 2 GB unit-test JVM plus a Kotlin daemon) got the first run killed during the unit
# tests ("The runner has received a shutdown signal"). So this workflow lowers the heap, compiles
# Kotlin in-process, adds swap, and builds the APK before the tests so it is kept either way.

on:
  push:
    branches: [ main ]
    # Docs and Markdown do not go into the release APK, so merging them does not need a ~25 minute build.
    paths-ignore: [ 'docs/**', '**/*.md' ]
  # No path filter on pull requests: the ruleset on main requires this check, and a required check
  # that never runs leaves a docs-only PR waiting forever. Public repositories have free minutes.
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Which APK to build
        type: choice
        options: [ release, debug ]
        default: release

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Only supersede older pull-request runs; never cancel a build of main halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: /mnt/gradle-home

    steps:
      - name: Decide what to build
        # debug = debug APK + unit tests (pull requests); release = optimised signed APK (main).
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.build }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) variant=debug ;;
            workflow_dispatch) variant="${CHOICE:-release}" ;;
            *) variant=release ;;
          esac
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Building the $variant variant (event: $EVENT)"

      - name: Checkout (full history and tags, needed for the version code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch the upstream tag the version code is derived from
        # Read-only fetch of one public tag. It is already an ancestor of main; this repo has no
        # copy of the tag until it is pushed once (see CLAUDE.md). A no-op when the tag exists.
        run: git fetch --no-tags https://github.com/connectbot/connectbot.git 'refs/tags/v1.12.0-alpha:refs/tags/v1.12.0-alpha'

      - name: Free disk space on the runner
        # Run 2 died with "No space left on device" on the root disk, right after the APK was
        # built. Remove big preinstalled toolchains this build never uses.
        continue-on-error: true
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h / /mnt

      - name: Prepare scratch disk (Gradle home and swap)
        # Gradle's home (downloads, transforms) moves to the separate /mnt disk, away from the
        # root disk that also holds the checkout, the Android SDK and the runner's own logs.
        run: |
          sudo mkdir -p /mnt/gradle-home
          sudo chown "$USER" /mnt/gradle-home
          sudo fallocate -l 4G /mnt/gradle-swap || true
          sudo chmod 600 /mnt/gradle-swap || true
          sudo mkswap /mnt/gradle-swap || true
          sudo swapon /mnt/gradle-swap || true
          free -h
          nproc

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Name the build
        # The artifact names carry the commit id, so "which build is this?" is answered at a glance.
        id: commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=$(git rev-parse --short=8 "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build open-source debug APK
        if: steps.plan.outputs.variant == 'debug'
        # Command-line properties override gradle.properties (lower heap, no separate Kotlin daemon).
        run: |
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleOssDebug

      - name: Inspect the debug APK
        if: steps.plan.outputs.variant == 'debug'
        # Answers "what is inside it?" from the log: the icon and Mosh files are listed from the
        # built APK itself.
        # Diagnostics only: if they fail, the APK is still uploaded.
        continue-on-error: true
        env:
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          set -eu
          short="$SHORT"
          apk="$(ls app/build/outputs/apk/oss/debug/*.apk | head -n 1)"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          {
            echo "### Debug APK for commit \`$short\`"
            echo "Ref: \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "== badging =="
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label:|application-icon|application:|launchable-activity)" || true
          echo "== launcher icon and Mosh files in the APK =="
          unzip -l "$apk" | grep -iE "mipmap|ic_launcher|moshexec|terminfo" || echo "(none found)"
          echo "== adaptive icon =="
          "$aapt2" dump xmltree --file res/mipmap-anydpi-v26/icon.xml "$apk" || true
          echo "== foreground drawable variants =="
          "$aapt2" dump resources "$apk" | grep -A8 "drawable/ic_launcher_foreground" || true

      - name: Upload debug APK
        if: steps.plan.outputs.variant == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shelldon-oss-debug-apk-${{ steps.commit.outputs.short }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release Gradle memory before the tests
        if: steps.plan.outputs.variant == 'debug'
        run: |
          ./gradlew --stop
          free -h
          df -h / /mnt

      - name: Run unit tests (including the OpenSSH container tests)
        if: steps.plan.outputs.variant == 'debug'
        # SHELLDON_CONTAINER_TESTS=1 switches on org.connectbot.shelldon.container.*: they start throw-away
        # OpenSSH servers in Docker (loopback only, nothing from the runner is passed in). With the
        # variable set a missing Docker fails the run instead of skipping. The base image comes from
        # Google's mirror of Docker Hub's official images because anonymous pulls from shared runners
        # are rate limited; it only builds a test server and never touches a secret.
        env:
          SHELLDON_CONTAINER_TESTS: '1'
          SHELLDON_TEST_BASE_IMAGE: mirror.gcr.io/library/debian:trixie-slim
        run: |
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testOssDebugUnitTest

      - name: Room schema is committed and current
        # Room's own schema export may leave app/schemas untouched, so two checks: (1) no tracked file
        # under app/schemas changed during the build, and (2) the identity hash in the newest schema
        # JSON equals the hash Room compiled into ConnectBotDatabase_Impl. A mismatch means the JSON
        # was not produced by Room for the current entities; the log shows the hash to commit.
        if: always() && steps.plan.outputs.variant == 'debug'
        run: |
          git add -N app/schemas
          status=0
          git diff --exit-code -- app/schemas || status=1
          newest="$(ls -v app/schemas/org.connectbot.data.ConnectBotDatabase/*.json | tail -n 1)"
          committed="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['database']['identityHash'])" "$newest")"
          impl="$(find app/build/generated -name 'ConnectBotDatabase_Impl*' \( -name '*.java' -o -name '*.kt' \) | head -n 1)"
          echo "newest schema: $newest"
          echo "generated:     ${impl:-<not found>}"
          real="$(grep -hoE '"[0-9a-f]{32}", "[0-9a-f]{32}"' "$impl" 2>/dev/null | head -n 1 | grep -oE '[0-9a-f]{32}' | head -n 1 || true)"
          echo "committed identityHash: $committed"
          echo "generated identityHash: ${real:-<not found>}"
          if [ -n "$real" ] && [ "$real" != "$committed" ]; then
            echo "::error::$newest has identityHash $committed but Room generated $real. Put $real in the file."
            status=1
          fi
          # (3) every CREATE TABLE / CREATE INDEX statement in the schema JSON must appear verbatim in
          # the code Room generated, so the JSON describes the tables the app really creates.
          if [ -n "$impl" ]; then
            python3 - "$newest" "$impl" <<'PY' || status=1
          import json, sys
          schema = json.load(open(sys.argv[1]))["database"]
          impl = open(sys.argv[2]).read()
          missing = []
          for e in schema["entities"]:
              table = e["tableName"]
              for q in [e["createSql"]] + [i["createSql"] for i in e.get("indices", [])]:
                  q = q.replace("${TABLE_NAME}", table)
                  if q not in impl:
                      missing.append(q)
          print("schema statements checked against generated code:", sum(1 + len(e.get("indices", [])) for e in schema["entities"]), "missing:", len(missing))
          for q in missing[:8]:
              print("  MISSING:", q)
              # show what Room generated for the same table or index, so the diff is visible in the log
              start = impl.find(q[: q.index("`", q.index("`") + 1) + 1])
              if start >= 0:
                  print("  GENERATED:", impl[start : impl.index('"', start)])
          sys.exit(1 if missing else 0)
          PY
          fi
          exit $status

      - name: Prepare the internal signing key (optional)
        if: steps.plan.outputs.variant == 'release'
        # With the key, every release APK carries the same signature, so a new build installs over
        # the previous one. Without it (secret not set) the release APK is signed with a throw-away
        # debug key, like the debug APK. Pull request runs never get here, so they never read it.
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHELLDON_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shelldon-internal.jks"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key secret set: the release APK uses a throw-away debug key and cannot be installed over the previous one."
          fi

      - name: Build optimised release APK
        if: steps.plan.outputs.variant == 'release'
        # R8-optimised, no coverage instrumentation, async memory tagging: this is the build to judge
        # smoothness with. Application id io.github.thowt.shelldon (no .debug), so it installs next
        # to the debug app and keeps its own data. Secrets reach only this step, as environment.
        env:
          STABLE: ${{ steps.key.outputs.stable }}
          KEYSTORE_PASSWORD: ${{ secrets.SHELLDON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHELLDON_KEY_ALIAS }}
        run: |
          set -eu
          ./gradlew --stop
          extra=""
          if [ "$STABLE" = "true" ]; then
            export ORG_GRADLE_PROJECT_keystoreFile="$RUNNER_TEMP/shelldon-internal.jks"
            export ORG_GRADLE_PROJECT_keystorePassword="$KEYSTORE_PASSWORD"
            export ORG_GRADLE_PROJECT_keystoreAlias="$KEY_ALIAS"
          else
            extra="-PshelldonSignWithDebugKey=true"
          fi
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            $extra :app:assembleOssRelease

      - name: Inspect the release APK
        if: steps.plan.outputs.variant == 'release'
        # Diagnostics only. The certificate fingerprint is public; it must stay the same from build
        # to build when the stable key is in use.
        continue-on-error: true
        env:
          SHORT: ${{ steps.commit.outputs.short }}
          STABLE: ${{ steps.key.outputs.stable }}
        run: |
          set -eu
          apk="$(ls app/build/outputs/apk/oss/release/*.apk | head -n 1)"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "== release badging =="
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^(package|application-label:)" || true
          echo "== signing certificate =="
          cert="$("$build_tools/apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)" || true)"
          echo "$cert"
          {
            echo "### Release APK for commit \`$SHORT\`"
            echo "Stable signing key in use: \`$STABLE\`"
            echo '```'
            echo "$cert"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        if: steps.plan.outputs.variant == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shelldon-oss-release-${{ steps.commit.outputs.short }}
          path: app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/shelldon-internal.jks"

      - name: Show resources after the build
        if: always()
        run: |
          free -h
          df -h / /mnt
          du -xsh "$GITHUB_WORKSPACE"/app/build "$GITHUB_WORKSPACE"/app/.cxx \
            /mnt/gradle-home "$ANDROID_HOME" 2>/dev/null || true
          du -xh --max-depth=1 "$GITHUB_WORKSPACE"/app/build 2>/dev/null | sort -h | tail -8 || true

      - name: Upload test reports
        if: always() && steps.plan.outputs.variant == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

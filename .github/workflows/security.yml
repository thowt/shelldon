name: Security

# Two scans that need no build, so they also run for docs-only changes:
#   secrets : gitleaks over the whole git history on every push and pull request
#   osv     : OSV-Scanner reads the dependency checksum file (gradle/verification-metadata.xml) and
#             reports known vulnerabilities; also once a week, because new advisories appear for old
#             dependencies without any change in this repository
# Both tools are downloaded as release binaries and checked against a SHA-256 written here, so a
# replaced release asset fails the run instead of being executed. No third-party action runs, no
# secret is read, the token is read-only. To update a tool: change the version and the checksum
# (taken from the release's own checksum file) together.

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    # The weekly run is about new advisories, not new commits.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the history
        # Findings are redacted in the log. Reviewed false positives are listed by exact fingerprint
        # in .gitleaksignore.
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  osv:
    name: Known vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: 2.5.1
      OSV_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --version

      - name: Scan the dependency checksum file
        # The file lists every library the build resolves, with versions. Exit status: 0 nothing found,
        # 1 vulnerabilities found, anything else the scan itself failed (for example no network).
        run: |
          set -eu
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo "::error::gradle/verification-metadata.xml is missing, so there is nothing to scan. Run the Dependency metadata workflow."
            exit 1
          fi
          "$RUNNER_TEMP/osv-scanner" scan source -L gradle/verification-metadata.xml

name: Dependency metadata

# Regenerates gradle/verification-metadata.xml, the list of SHA-256 checksums Gradle checks every
# downloaded library against. Run it by hand (Actions -> Dependency metadata -> Run workflow, pick
# the branch) after changing a dependency or a plugin version. It also runs on a pull request while
# the file does not exist yet (the first generation).
#
# The runner cannot push, so the result comes back as a log block and an artifact:
#   - the log prints each generated file as gzip + base64 between BEGIN/END markers
#   - the artifact "dependency-metadata" holds the same file(s)
# A person (or Claude Code) copies it into gradle/ and commits it after reading the diff. The
# checksums come from a fresh download with the Gradle cache switched off, so a stale or tampered
# cache cannot end up in the file.
#
# It builds what the Build and Checks workflows build, so every artifact those need gets a checksum.

on:
  workflow_dispatch:
  pull_request:
    paths: [ '.github/workflows/dependency-metadata.yml' ]

permissions:
  contents: read

jobs:
  gate:
    name: Is a new file needed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ] || [ ! -f gradle/verification-metadata.xml ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "gradle/verification-metadata.xml exists; nothing to generate on a pull request."
          fi

  generate:
    name: Generate checksums
    needs: gate
    if: needs.gate.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_USER_HOME: /mnt/gradle-home
    steps:
      - name: Checkout (full history and tags, needed for the version code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch the upstream tag the version code is derived from
        run: git fetch --no-tags https://github.com/connectbot/connectbot.git 'refs/tags/v1.12.0-alpha:refs/tags/v1.12.0-alpha'

      - name: Free disk space on the runner
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo apt-get clean || true
          df -h / /mnt

      - name: Prepare scratch disk (Gradle home and swap)
        run: |
          sudo mkdir -p /mnt/gradle-home
          sudo chown "$USER" /mnt/gradle-home
          sudo fallocate -l 4G /mnt/gradle-swap || true
          sudo chmod 600 /mnt/gradle-swap || true
          sudo mkswap /mnt/gradle-swap || true
          sudo swapon /mnt/gradle-swap || true
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle (no cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Resolve everything the pipeline uses and write the checksums
        # Debug and release builds (R8), Android lint, the Spotless tool chain and the unit-test
        # runtime classpath (one cheap test is enough to resolve it). --continue and the trailing
        # || true: a failing check must not stop later tasks from resolving their dependencies, and
        # what matters here is the file, which the next step looks for.
        run: |
          ./gradlew --continue --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PshelldonSignWithDebugKey=true -PspotlessFull \
            --write-verification-metadata sha256 \
            :app:assembleOssDebug :app:assembleOssRelease :app:lintOssDebug spotlessCheck \
            :app:testOssDebugUnitTest --tests 'org.connectbot.shelldon.ssh.CryptoDefaultsTest' || true

      - name: Print the generated files
        run: |
          set -eu
          found="$(find . -name verification-metadata.xml -not -path '*/build/*' -not -path './.git/*' | sort)"
          if [ -z "$found" ]; then
            echo "::error::No verification-metadata.xml was written."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/metadata"
          for f in $found; do
            echo "$f: $(wc -l < "$f") lines, $(grep -c '<component ' "$f") components"
            mkdir -p "$RUNNER_TEMP/metadata/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/metadata/$f"
            echo "-----BEGIN GZIP BASE64 $f-----"
            gzip -9 -c "$f" | base64 -w 120
            echo "-----END GZIP BASE64 $f-----"
          done

      - name: Upload the generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-metadata
          path: ${{ runner.temp }}/metadata
          if-no-files-found: error
          retention-days: 7

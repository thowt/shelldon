name: Checks

# Static checks that run beside the Build workflow, each in its own job so they finish early and
# show up as separate results:
#   style : spotlessCheck over everything (no "changed since main" shortcut): ktlint with the Compose
#           rules on all Kotlin, licence headers, trailing whitespace, final newlines
#   lint  : Android lint on the oss debug variant; pull requests and manual runs only
# Same rules as build.yml: read-only token, no secrets, every action pinned to a full commit SHA.
# Secret scanning and the dependency vulnerability scan are in security.yml, which also runs for
# docs-only changes.

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    paths-ignore: [ 'docs/**', '**/*.md' ]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  style:
    name: Spotless and ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history and tags, needed for the version code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch the upstream tag the version code is derived from
        run: git fetch --no-tags https://github.com/connectbot/connectbot.git 'refs/tags/v1.12.0-alpha:refs/tags/v1.12.0-alpha'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Spotless check
        id: spotless
        run: |
          ./gradlew --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PspotlessFull spotlessCheck

      - name: Show what spotlessApply would change
        # The runner cannot push, so the fix comes back as a patch: printed here and attached.
        if: failure() && steps.spotless.outcome == 'failure'
        run: |
          ./gradlew --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PspotlessFull spotlessApply || true
          git diff > "$RUNNER_TEMP/spotless.patch" || true
          {
            echo "### Spotless wants these changes"
            echo '```'
            git diff --stat | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          wc -l "$RUNNER_TEMP/spotless.patch"
          head -n 800 "$RUNNER_TEMP/spotless.patch"

      - name: Upload the Spotless patch
        if: failure() && steps.spotless.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotless-patch
          path: ${{ runner.temp }}/spotless.patch
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Android lint
    # Lint compiles most of the app, so it is left out of pushes to main (the Build workflow builds
    # there anyway). It runs for pull requests and by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: /mnt/gradle-home
    steps:
      - name: Checkout (full history and tags, needed for the version code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch the upstream tag the version code is derived from
        run: git fetch --no-tags https://github.com/connectbot/connectbot.git 'refs/tags/v1.12.0-alpha:refs/tags/v1.12.0-alpha'

      - name: Free disk space on the runner
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo apt-get clean || true
          df -h / /mnt

      - name: Prepare scratch disk (Gradle home and swap)
        # The same memory limits as build.yml: private repositories get a 2-vCPU / 7 GB runner.
        run: |
          sudo mkdir -p /mnt/gradle-home
          sudo chown "$USER" /mnt/gradle-home
          sudo fallocate -l 4G /mnt/gradle-swap || true
          sudo chmod 600 /mnt/gradle-swap || true
          sudo mkswap /mnt/gradle-swap || true
          sudo swapon /mnt/gradle-swap || true
          free -h

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Run Android lint (oss debug)
        id: lint
        run: |
          ./gradlew --stacktrace --console=plain --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:lintOssDebug

      - name: Summarise the lint report
        # So the findings can be read in the log without downloading the report.
        if: always() && steps.lint.outcome != 'skipped'
        run: python3 .github/scripts/lint_summary.py app/build/reports

      - name: Upload lint reports
        if: always() && steps.lint.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14

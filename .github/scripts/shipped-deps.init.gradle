// Gradle init script, used by .github/workflows/security.yml only (not part of the build).
//
// Writes every library that ends up on the runtime classpath of the release app, one
// "group:name:version" per line, to the file named in SHIPPED_DEPS_OUT. That is what the APK is
// made of, as opposed to gradle/verification-metadata.xml, which also lists the Android Gradle
// plugin, lint, test and formatting tools. The vulnerability scan gates on this list.
//
//   SHIPPED_DEPS_OUT=shipped-deps.txt ./gradlew --no-configuration-cache \
//       --init-script .github/scripts/shipped-deps.init.gradle :app:shippedDependencies
//
// Next to it, <file>.parents lists "library <- libraries that ask for it". Resolves dependencies
// only; nothing is compiled.

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        // The init script also runs for buildSrc and included builds, which have no :app.
        return
    }
    app.tasks.register('shippedDependencies') {
        group = 'verification'
        description = 'Lists the libraries on the release runtime classpath'
        notCompatibleWithConfigurationCache('prints the resolved dependency graph')
        doLast {
            def configName = 'ossReleaseRuntimeClasspath'
            def config = app.configurations.findByName(configName)
            if (config == null) {
                throw new GradleException("Configuration ${configName} not found, have: ${app.configurations.names}")
            }
            def libs = new TreeSet<String>()
            def parents = new TreeMap<String, TreeSet<String>>()
            def label = { component ->
                def id = component.moduleVersion
                id != null ? "${id.group}:${id.name}:${id.version}".toString() : component.id.displayName
            }
            config.incoming.resolutionResult.allComponents.each { component ->
                if (component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    def key = label(component)
                    libs.add(key)
                    component.dependents.each { dependency ->
                        parents.computeIfAbsent(key) { new TreeSet<String>() }.add(label(dependency.from))
                    }
                }
            }
            if (libs.isEmpty()) {
                throw new GradleException("${configName} resolved to nothing")
            }
            def out = new File(System.getenv('SHIPPED_DEPS_OUT') ?: 'shipped-deps.txt')
            out.text = libs.join('\n') + '\n'
            // Who brings each library in, to find the one to update when a library is flagged.
            new File(out.path + '.parents').text =
                parents.collect { key, from -> "${key} <- ${from.join(', ')}" }.join('\n') + '\n'
            println "Wrote ${libs.size()} libraries from ${configName} to ${out.absolutePath}"
        }
    }
}
